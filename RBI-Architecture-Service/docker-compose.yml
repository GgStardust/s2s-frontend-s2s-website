version: '3.8'

services:
  rbi-architecture-service:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./dist:/app/dist
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/field/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

