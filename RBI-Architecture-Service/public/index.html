<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBI Demo - Choose Your Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #14b8a6;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .demo-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .demo-link {
            display: block;
            padding: 20px 30px;
            background: rgba(20, 184, 166, 0.1);
            border: 2px solid rgba(20, 184, 166, 0.3);
            border-radius: 12px;
            color: #14b8a6;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 500;
            transition: all 0.3s;
        }
        .demo-link:hover {
            background: rgba(20, 184, 166, 0.2);
            border-color: #14b8a6;
            transform: translateY(-2px);
        }
        .demo-link strong {
            display: block;
            margin-bottom: 5px;
            font-size: 1.3rem;
        }
        .demo-link small {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RBI Architecture Service</h1>
        <p>Choose a demo to explore</p>
        <div class="demo-links">
            <a href="tpb-comprehensive-demo.html" class="demo-link">
                <strong>TPB Comprehensive Demo</strong>
                <small>Complete showcase with all features - Station Intelligence, NFC Demo, Multi-Dimensional Search, and more</small>
            </a>
            <a href="demo.html" class="demo-link">
                <strong>Enterprise Demo</strong>
                <small>Financial services fraud detection showcase</small>
            </a>
            <a href="index.html" class="demo-link">
                <strong>API Testing Interface</strong>
                <small>Test all RBI endpoints interactively</small>
            </a>
        </div>
    </div>
</body>
</html>
