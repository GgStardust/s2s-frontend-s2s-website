name: Sync Content to Supabase

on:
  push:
    branches:
      - main
    paths:
      - '09_PROCESSED/**/*.md'
      - 'scripts/sync-content.ts'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-content:
    name: Sync Content to Supabase
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync content to Supabase
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || 'http://localhost:3000' }}
          CONTENT_ROOT: ${{ env.CONTENT_ROOT || '09_PROCESSED' }}
        run: |
          npx tsx scripts/sync-content.ts > sync-output.log 2>&1 || true
          # Extract summary from output
          echo "SYNC_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          cat sync-output.log >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate sync report
        if: always()
        run: |
          mkdir -p .github/sync-reports
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          
          # Parse sync output and create JSON report
          cat > .github/sync-reports/sync-${TIMESTAMP}.json << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "trigger": "${{ github.event_name }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "summary": {
              "totalFiles": 0,
              "imported": 0,
              "updated": 0,
              "skipped": 0,
              "errors": 0
            },
            "files": [],
            "errors": [],
            "durationMs": 0
          }
          EOF
          
          # Try to extract actual numbers from sync output if available
          if [ -f sync-output.log ]; then
            IMPORTED=$(grep -oP 'Imported: \K\d+' sync-output.log || echo "0")
            UPDATED=$(grep -oP 'Updated: \K\d+' sync-output.log || echo "0")
            SKIPPED=$(grep -oP 'Skipped: \K\d+' sync-output.log || echo "0")
            ERRORS=$(grep -oP 'Errors: \K\d+' sync-output.log || echo "0")
            
            # Update JSON with actual values
            cat > .github/sync-reports/sync-${TIMESTAMP}.json << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "trigger": "${{ github.event_name }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "summary": {
              "totalFiles": 0,
              "imported": ${IMPORTED},
              "updated": ${UPDATED},
              "skipped": ${SKIPPED},
              "errors": ${ERRORS}
            },
            "files": [],
            "errors": [],
            "durationMs": 0
          }
          EOF
          fi

      - name: Generate Markdown summary
        if: always()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          cat > .github/sync-reports/sync-${TIMESTAMP}.md << EOF
          # Content Sync Report
          
          **Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Trigger:** ${{ github.event_name }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          **Actor:** ${{ github.actor }}
          
          ## Summary
          
          - ✅ Imported: $(grep -oP 'Imported: \K\d+' sync-output.log || echo "0")
          - 🔄 Updated: $(grep -oP 'Updated: \K\d+' sync-output.log || echo "0")
          - ⏭️ Skipped: $(grep -oP 'Skipped: \K\d+' sync-output.log || echo "0")
          - ❌ Errors: $(grep -oP 'Errors: \K\d+' sync-output.log || echo "0")
          
          ## Full Output
          
          \`\`\`
          $(cat sync-output.log || echo "No output available")
          \`\`\`
          EOF

      - name: Upload sync report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.sha }}
          path: |
            .github/sync-reports/sync-*.json
            .github/sync-reports/sync-*.md
            sync-output.log
          retention-days: 90

      - name: Comment PR with sync summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '.github/sync-reports/sync-*.json';
            const files = fs.readdirSync('.github/sync-reports').filter(f => f.endsWith('.json'));
            
            if (files.length > 0) {
              const report = JSON.parse(fs.readFileSync(`.github/sync-reports/${files[0]}`, 'utf8'));
              const summary = report.summary;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📊 Content Sync Summary
                
                - ✅ Imported: ${summary.imported}
                - 🔄 Updated: ${summary.updated}
                - ⏭️ Skipped: ${summary.skipped}
                - ❌ Errors: ${summary.errors}
                
                [View full report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            }

